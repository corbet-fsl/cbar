schema = 1
project = "cbar"

# Real Scroll/Wayland release-matrix and headless-session scripts remain explicit gates; unit tests alone are not their evidence.

[checks.rust]
kind = "commands"
commands = [["nix", "develop", "--no-update-lock-file", "--command", "cargo", "test", "--locked"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["nix", "--version"]]

[checks.fmt]
kind = "cargo"
actions = ["fmt"]

[checks.mpris]
kind = "commands"
commands = [["nix", "develop", "--no-update-lock-file", "--command", "bash", "checks/mpris-session.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["nix", "--version"]]

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["nix", "--version"]]

[render]
tool_revision = "10a28f64c3bb63dfade833dd219cba0f504c9345"
tool_sha256 = "fe74ddd559238d99c9fad0655468edebac57be6031156ccbc09e35fb88959243"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["rust", "fmt", "mpris", "verify"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
